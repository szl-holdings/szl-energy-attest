[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-energy-attest"
version = "0.3.0"
description = "Attestable energy receipts for governed compute — MEASURED-NVML joules, cheapest-watt placement, hash-chained signable receipts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen Lutar" }]
keywords = ["energy", "governance", "provenance", "nvml", "attestation", "hash-chain"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# Pure-stdlib core (hashlib + json). NVML measurement is optional and only
# produces a number on a real GPU box — never required to verify a chain.
dependencies = []

[project.optional-dependencies]
gpu = ["pynvml>=11.0"]
# Optional DSSE/ECDSA-P256 per-receipt signing via the shared szl-receipt lib.
# Opt-in; the import is lazy so the stdlib-only core is unchanged without it.
sign = ["szl-receipt>=0.2.0"]
test = ["pytest"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-energy-attest"
"Hugging Face" = "https://huggingface.co/SZLHOLDINGS"

[project.scripts]
szl-energy-attest = "szl_energy_attest.cli:main"

[tool.setuptools]
# Includes the folded-in live inference metering subpackage (Wave D: absorbed
# from the now-DEPRECATED governed-inference-meter repo).
packages = ["szl_energy_attest", "szl_energy_attest.inference_meter"]
