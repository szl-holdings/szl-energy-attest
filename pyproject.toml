[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-energy-attest"
version = "0.3.2"
description = "Attestable energy receipts for governed compute — MEASURED-NVML joules, cheapest-watt placement, hash-chained signable receipts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Stephen Lutar" }]
keywords = ["energy", "governance", "provenance", "nvml", "attestation", "hash-chain"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Pure-stdlib core (hashlib + json). NVML measurement is optional and only
# produces a number on a real GPU box — never required to verify a chain.
dependencies = []

[project.optional-dependencies]
gpu = ["pynvml>=11.0"]
# Optional DSSE/ECDSA-P256 per-receipt signing via the shared szl-receipt lib.
# Opt-in; the import is lazy so the stdlib-only core is unchanged without it.
sign = ["szl-receipt-dsse>=0.3.0"]
proxy = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24"]
test = ["pytest"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-energy-attest"
"Hugging Face" = "https://huggingface.co/SZLHOLDINGS"
Issues = "https://github.com/szl-holdings/szl-energy-attest/issues"
Changelog = "https://github.com/szl-holdings/szl-energy-attest/releases"

[project.scripts]
szl-energy-attest = "szl_energy_attest.cli:main"

[tool.setuptools]
# Includes the folded-in live inference metering subpackage (Wave D: absorbed
# from the now-DEPRECATED governed-inference-meter repo) plus the v1 vertical
# per-inference joule-receipt proxy (szl_energy_attest/meter_proxy, namespaced in 0.3.2).
packages = ["szl_energy_attest", "szl_energy_attest.inference_meter", "szl_energy_attest.meter_proxy"]

[tool.szl.release]
import_names = ["szl_energy_attest"] # wheel top-level import names; the release gate fails if the built wheel differs
