name: CI

on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
  merge_group:
    types:
    - checks_requested
    branches:
    - '**'
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + signing lib
        run: |
          pip install pytest
          pip install "git+https://github.com/szl-holdings/szl-receipt.git@v0.2.0"
          pip install -e ".[proxy]"
      - name: Run pytest
        run: |
          python -c "from szl_energy_attest.meter_proxy.proxy import _HAVE_WEB; assert _HAVE_WEB, 'Proxy regression dependencies are unavailable'"
          pytest -q
